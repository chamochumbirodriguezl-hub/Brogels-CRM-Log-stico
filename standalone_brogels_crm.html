  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandRed: '#dc2626',
            brandIndigo: '#4f46e5',
            brandAmber: '#d97706'
          }
        }
      }
    }
  </script>
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090d16; color: #f1f5f9; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased overflow-hidden select-none">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Constantes y datos iniciales de simulación
    const STORAGE_KEY = 'brogels_crm_standalone_v1';

    const INITIAL_LEADS = [
      {
        id: "SRC-2026-0810",
        fecha: "2026-10-06",
        cliente: "Constructora & Minera del Centro S.A.C.",
        ruc: "20551122334",
        contacto: "Ing. Roberto Alarcón",
        telefono: "+51 984512369",
        email: "ralarcon@mineradelcentro.pe",
        origen: "Sourcing China",
        servicio: "Sourcing China",
        etapa: "GESTION_INFO",
        incoterm: "FOB",
        pol: "CNSHA - Shanghai, China",
        pod: "PECLL - Callao, Perú",
        modo: "Marítimo FCL",
        equipos: "1x40'Flat Rack + 1x40'HC",
        pesoKg: 22500,
        volumenCbm: 68,
        costoCompra: 58500,
        precioVenta: 66900,
        profit: 8400,
        comercial: "Yuri Vega",
        empresaGrupo: "Compras Internacionales",
        sourcing: {
          proveedorChina: "SANY Heavy Industry Co., Ltd.",
          ciudadInspeccion: "Changsha / Shanghai",
          estadoSourcing: "Inspección en China",
          maquinariaMarca: "SANY",
          maquinariaModelo: "SY215C (Excavadora 22T)",
          maquinariaEspecificaciones: "Motor Isuzu 4HK1X, Balde HD 1.0 m³, Zapatas 600mm",
          partidaArancelaria: "8429.52.00.00",
          costoMaquinariaFob: 52000,
          comisionSourcingPct: 7
        },
        notas: "Inspección técnica programada con peritaje en planta antes del despacho.",
        historial: [
          { id: "h1", fecha: "2026-10-06 10:15", autor: "Yuri Vega", tipo: "whatsapp", contenido: "Se envió ficha técnica de maquinaria a través de WhatsApp API." }
        ]
      },
      {
        id: "SLI-2026-1089",
        fecha: "2026-10-06",
        cliente: "Importadora San Martín S.A.C.",
        ruc: "20512345678",
        contacto: "Luis Rodríguez",
        telefono: "+51 987654321",
        email: "lrodriguez@sanmartin.pe",
        origen: "Meta Ads",
        servicio: "SLI",
        etapa: "GESTION_INFO",
        incoterm: "FOB",
        pol: "CNNBO - Ningbo",
        pod: "PECLL - Callao",
        modo: "Marítimo FCL",
        equipos: "1x40'HC",
        pesoKg: 18500,
        volumenCbm: 62,
        costoCompra: 2420,
        precioVenta: 3180,
        profit: 760,
        comercial: "Yuri Vega",
        empresaGrupo: "Branko",
        notas: "Cliente solicita 21 días libres de sobreestadía (demurrage).",
        historial: [
          { id: "h2", fecha: "2026-10-06 09:30", autor: "Yuri Vega", tipo: "nota", contenido: "Contacto inicial en Expoalimentaria." }
        ]
      },
      {
        id: "ADU-2026-042",
        fecha: "2026-10-05",
        cliente: "Comercializadora del Sur E.I.R.L.",
        ruc: "20600112233",
        contacto: "Carlos Mendoza",
        telefono: "+51 912345678",
        email: "cmendoza@comdelsur.com",
        origen: "Google Search",
        servicio: "Aduana",
        etapa: "COTIZADO",
        incoterm: "CIF",
        pol: "MIA - Miami",
        pod: "LIM - Jorge Chávez (Aéreo)",
        modo: "Carga Aérea",
        equipos: "12 Bultos",
        pesoKg: 450,
        volumenCbm: 2.5,
        costoCompra: 300,
        precioVenta: 600,
        profit: 300,
        comercial: "Mario Esteban",
        empresaGrupo: "Hogels",
        notas: "Repuestos electromecánicos urgentes.",
        historial: []
      }
    ];

    const STAGES = [
      { key: 'PROSPECCION', title: '1. Prospección', color: 'border-blue-500' },
      { key: 'GESTION_INFO', title: '2. Gestión Info', color: 'border-amber-500' },
      { key: 'COTIZADO', title: '3. Cotización', color: 'border-purple-500' },
      { key: 'GANADO', title: '4. Cierre Ganado', color: 'border-emerald-500' },
      { key: 'PERDIDO', title: '5. Cierre Perdido', color: 'border-rose-500' }
    ];

    function BrogelsCRMApp() {
      const [leads, setLeads] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch(e) {}
        return INITIAL_LEADS;
      });

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(leads)); } catch(e) {}
      }, [leads]);

      const [viewMode, setViewMode] = useState('kanban'); // 'kanban', 'table', 'quoter'
      const [filterCompany, setFilterCompany] = useState('ALL'); // 'ALL', 'Branko', 'Hogels', 'Compras Internacionales'
      const [searchTerm, setSearchTerm] = useState('');

      // Modales
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [selectedLead, setSelectedLead] = useState(null);
      const [voipModalLead, setVoipModalLead] = useState(null);
      const [whatsAppModalLead, setWhatsAppModalLead] = useState(null);

      // Sourcing & Quoter State
      const [sourcingFob, setSourcingFob] = useState(52000);
      const [brankoFreight, setBrankoFreight] = useState(4800);
      const [hogelsCustoms, setHogelsCustoms] = useState(650);
      const [sourcingCommPct, setSourcingCommPct] = useState(8);

      const sourcingCommUsd = Math.round((sourcingFob * sourcingCommPct) / 100);
      const totalSourcingCost = sourcingFob + brankoFreight + hogelsCustoms;
      const totalSourcingVenta = sourcingFob + Math.round(brankoFreight * 1.15) + Math.round(hogelsCustoms * 1.25) + sourcingCommUsd;
      const totalSourcingProfit = totalSourcingVenta - totalSourcingCost;

      // Filtrado
      const filteredLeads = useMemo(() => {
        return leads.filter(l => {
          if (filterCompany !== 'ALL' && l.empresaGrupo !== filterCompany) return false;
          if (searchTerm.trim()) {
            const term = searchTerm.toLowerCase();
            return l.cliente.toLowerCase().includes(term) ||
                   l.ruc.toLowerCase().includes(term) ||
                   (l.sourcing?.maquinariaMarca && l.sourcing.maquinariaMarca.toLowerCase().includes(term));
          }
          return true;
        });
      }, [leads, filterCompany, searchTerm]);

      // KPIs
      const totalPipeline = filteredLeads.reduce((a, b) => a + Number(b.precioVenta || 0), 0);
      const totalProfit = filteredLeads.reduce((a, b) => a + Number(b.profit || 0), 0);
      const totalCbm = filteredLeads.reduce((a, b) => a + Number(b.volumenCbm || 0), 0);

      const moveStage = (id, newStage) => {
        setLeads(leads.map(l => l.id === id ? { ...l, etapa: newStage } : l));
      };

      // Nuevo Lead Form State
      const [newLead, setNewLead] = useState({
        cliente: '', ruc: '', contacto: '', telefono: '', email: '',
        servicio: 'Sourcing China', empresaGrupo: 'Compras Internacionales',
        incoterm: 'FOB', pol: 'CNSHA - Shanghai', pod: 'PECLL - Callao',
        modo: 'Marítimo FCL', equipos: "1x40'Flat Rack + 1x40'HC",
        pesoKg: 22000, volumenCbm: 65, costoCompra: 55000, precioVenta: 63000,
        sourcing: {
          proveedorChina: 'SANY Heavy Industry', ciudadInspeccion: 'Shanghai',
          estadoSourcing: 'Cotización Maquinaria', maquinariaMarca: 'SANY',
          maquinariaModelo: 'SY215C', partidaArancelaria: '8429.52.00.00'
        }
      });

      const handleCreateLead = (e) => {
        e.preventDefault();
        const profit = Number(newLead.precioVenta) - Number(newLead.costoCompra);
        const item = {
          ...newLead,
          id: newLead.empresaGrupo === 'Compras Internacionales' ? `SRC-2026-${Math.floor(1000 + Math.random() * 9000)}` : `BRO-${Math.floor(1000 + Math.random() * 9000)}`,
          fecha: new Date().toISOString().split('T')[0],
          etapa: 'PROSPECCION',
          profit: profit > 0 ? profit : 0,
          comercial: 'Yuri Vega',
          historial: [{ id: Date.now().toString(), fecha: new Date().toLocaleString(), autor: 'Yuri Vega', tipo: 'nota', contenido: 'Lead creado en CRM' }]
        };
        setLeads([item, ...leads]);
        setIsModalOpen(false);
      };

      return (
        <div className="flex h-screen bg-slate-950 text-slate-100 overflow-hidden font-sans">
          
          {/* SIDEBAR */}
          <aside className="w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between shrink-0">
            <div>
              <div className="p-5 border-b border-slate-800">
                <div className="flex items-center space-x-3">
                  <div className="h-10 w-10 rounded-xl bg-gradient-to-tr from-amber-600 via-red-600 to-indigo-600 flex items-center justify-center font-black text-xl shadow-lg shadow-red-950/40">
                    B
                  </div>
                  <div>
                    <h1 className="font-extrabold text-base tracking-wider text-white">BROGELS</h1>
                    <p className="text-[10px] text-slate-400 font-medium tracking-wider uppercase">Logistics & Sourcing</p>
                  </div>
                </div>
                <div className="mt-3 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 text-[11px] text-slate-400 flex justify-between items-center">
                  <span>Grupo:</span>
                  <span className="text-amber-400 font-bold">Branko, Hogels & China</span>
                </div>
              </div>

              {/* NAVEGACIÓN */}
              <nav className="p-3 space-y-1 text-xs">
                <button 
                  onClick={() => setViewMode('kanban')}
                  className={`w-full flex items-center space-x-2.5 px-3 py-2.5 rounded-lg font-semibold transition ${viewMode === 'kanban' ? 'bg-red-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-900'}`}
                >
                  <span>📊</span>
                  <span>Pipeline Kanban</span>
                </button>
                <button 
                  onClick={() => setViewMode('table')}
                  className={`w-full flex items-center space-x-2.5 px-3 py-2.5 rounded-lg font-semibold transition ${viewMode === 'table' ? 'bg-red-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-900'}`}
                >
                  <span>📋</span>
                  <span>Lista de Leads</span>
                </button>
                <button 
                  onClick={() => setViewMode('quoter')}
                  className={`w-full flex items-center space-x-2.5 px-3 py-2.5 rounded-lg font-semibold transition ${viewMode === 'quoter' ? 'bg-red-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-900'}`}
                >
                  <span>🚜</span>
                  <span>Cotizador Sourcing China</span>
                </button>
              </nav>

              {/* FILTROS POR EMPRESA OPERATIVA */}
              <div className="p-3 border-t border-slate-800 space-y-1 text-xs">
                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-3 py-1">Unidades del Grupo:</p>
                <button
                  onClick={() => setFilterCompany('ALL')}
                  className={`w-full text-left px-3 py-1.5 rounded-lg transition ${filterCompany === 'ALL' ? 'bg-slate-800 text-white font-bold' : 'text-slate-400 hover:bg-slate-900'}`}
                >
                  Todo el Grupo Brogels
                </button>
                <button
                  onClick={() => setFilterCompany('Branko')}
                  className={`w-full text-left px-3 py-1.5 rounded-lg transition ${filterCompany === 'Branko' ? 'bg-red-950 text-red-300 font-bold border border-red-800' : 'text-slate-400 hover:bg-slate-900'}`}
                >
                  🔴 Branko Cargo (Fletes)
                </button>
                <button
                  onClick={() => setFilterCompany('Hogels')}
                  className={`w-full text-left px-3 py-1.5 rounded-lg transition ${filterCompany === 'Hogels' ? 'bg-indigo-950 text-indigo-300 font-bold border border-indigo-800' : 'text-slate-400 hover:bg-slate-900'}`}
                >
                  🔵 Hogels Aduanas (SLI)
                </button>
                <button
                  onClick={() => setFilterCompany('Compras Internacionales')}
                  className={`w-full text-left px-3 py-1.5 rounded-lg transition ${filterCompany === 'Compras Internacionales' ? 'bg-amber-950 text-amber-300 font-bold border border-amber-800' : 'text-slate-400 hover:bg-slate-900'}`}
                >
                  🟡 Compras Int. (Sourcing China)
                </button>
              </div>
            </div>

            <div className="p-4 border-t border-slate-800 text-xs flex items-center justify-between">
              <div>
                <p className="font-bold text-slate-200">Yuri Vega</p>
                <p className="text-[10px] text-slate-400">Head of China & Logistics</p>
              </div>
              <button 
                onClick={() => { localStorage.clear(); setLeads(INITIAL_LEADS); }}
                className="text-slate-500 hover:text-slate-300 text-[10px] p-1"
                title="Reiniciar datos demo"
              >
                Reset
              </button>
            </div>
          </aside>

          {/* ÁREA CENTRAL */}
          <main className="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            {/* HEADER */}
            <header className="bg-slate-950 border-b border-slate-800 px-6 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h2 className="text-lg font-bold text-white flex items-center gap-2">
                  <span>CRM Logístico & Sourcing en China (Maquinaria Pesada)</span>
                </h2>
                <p className="text-xs text-slate-400">Control de sourcing en origen, fletes internacionales y agenciamiento aduanero.</p>
              </div>

              <div className="flex items-center gap-3">
                <input
                  type="text"
                  placeholder="Buscar cliente, RUC, máquina..."
                  value={searchTerm}
                  onChange={e => setSearchTerm(e.target.value)}
                  className="bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-red-500 w-52"
                />
                <button
                  onClick={() => setIsModalOpen(true)}
                  className="bg-red-600 hover:bg-red-500 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-lg shadow-red-950 transition"
                >
                  + Nuevo Lead / Sourcing
                </button>
              </div>
            </header>

            {/* KPIS */}
            <section className="bg-slate-900/40 p-4 border-b border-slate-800 grid grid-cols-1 md:grid-cols-3 gap-4 shrink-0">
              <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800">
                <p className="text-[11px] text-slate-400 font-medium">Pipeline Activo Total</p>
                <p className="text-xl font-black font-mono text-white mt-1">${totalPipeline.toLocaleString()} USD</p>
                <p className="text-[10px] text-slate-400">{filteredLeads.length} operaciones activas</p>
              </div>

              <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800">
                <p className="text-[11px] text-slate-400 font-medium">Profit Consolidado (Margen)</p>
                <p className="text-xl font-black font-mono text-emerald-400 mt-1">+${totalProfit.toLocaleString()} USD</p>
                <p className="text-[10px] text-emerald-500 font-mono">Flete + Aduana + Comisión Sourcing</p>
              </div>

              <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800">
                <p className="text-[11px] text-slate-400 font-medium">Volumen Cotizado (CBM)</p>
                <p className="text-xl font-black font-mono text-sky-400 mt-1">{totalCbm} CBM</p>
                <p className="text-[10px] text-slate-400">Contenedores & Flat Racks</p>
              </div>
            </section>

            {/* VISTAS */}
            <div className="flex-1 overflow-auto p-6">
              
              {/* VISTA 1: KANBAN */}
              {viewMode === 'kanban' && (
                <div className="grid grid-cols-5 gap-3.5 min-w-[1240px] h-full pb-4">
                  {STAGES.map(stage => {
                    const stageLeads = filteredLeads.filter(l => l.etapa === stage.key);
                    return (
                      <div key={stage.key} className="bg-slate-950/70 rounded-xl border border-slate-800 flex flex-col h-full overflow-hidden">
                        <div className={`p-3 border-b-2 ${stage.color} bg-slate-900/40 flex justify-between items-center`}>
                          <h3 className="text-xs font-bold text-slate-200">{stage.title}</h3>
                          <span className="bg-slate-800 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded-full font-mono">{stageLeads.length}</span>
                        </div>

                        <div className="flex-1 overflow-y-auto p-2.5 space-y-2.5">
                          {stageLeads.map(item => (
                            <div key={item.id} className="bg-slate-900 p-3.5 rounded-xl border border-slate-800 hover:border-slate-700 shadow-md space-y-2">
                              <div className="flex justify-between items-start">
                                <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${
                                  item.empresaGrupo === 'Compras Internacionales' ? 'bg-amber-950 text-amber-300 border border-amber-800' :
                                  item.empresaGrupo === 'Branko' ? 'bg-red-950 text-red-300 border border-red-800' :
                                  'bg-indigo-950 text-indigo-300 border border-indigo-800'
                                }`}>
                                  {item.empresaGrupo === 'Compras Internacionales' ? 'Sourcing China' : item.empresaGrupo}
                                </span>
                                <span className="text-[10px] font-mono text-slate-500">{item.id}</span>
                              </div>

                              <h4 className="font-bold text-xs text-slate-100">{item.cliente}</h4>
                              <p className="text-[10px] text-slate-400 font-mono">RUC: {item.ruc} · {item.contacto}</p>

                              {item.sourcing && (
                                <div className="bg-amber-950/30 p-2 rounded border border-amber-900/50 text-[10px] text-amber-300">
                                  🚜 <strong>{item.sourcing.maquinariaMarca} {item.sourcing.maquinariaModelo}</strong> ({item.sourcing.estadoSourcing})
                                </div>
                              )}

                              <div className="bg-slate-950 p-2 rounded text-[11px] font-mono text-slate-300 flex justify-between">
                                <span>{item.pol.split('-')[0]} ➔ {item.pod.split('-')[0]}</span>
                                <span className="text-slate-400 font-bold">{item.incoterm}</span>
                              </div>

                              <div className="flex justify-between items-center pt-1 border-t border-slate-800">
                                <div>
                                  <span className="text-[9px] text-slate-500 uppercase block">Venta</span>
                                  <span className="font-bold font-mono text-xs text-white">${Number(item.precioVenta).toLocaleString()}</span>
                                </div>
                                <div className="text-right">
                                  <span className="text-[9px] text-slate-500 uppercase block">Profit</span>
                                  <span className="font-bold font-mono text-xs text-emerald-400">+${Number(item.profit).toLocaleString()}</span>
                                </div>
                              </div>

                              {/* ACCIONES DE COMUNICACIÓN RÁPIDA */}
                              <div className="grid grid-cols-2 gap-1.5 pt-1">
                                <button
                                  onClick={() => setVoipModalLead(item)}
                                  className="py-1 px-2 bg-blue-950 hover:bg-blue-900 border border-blue-800 text-blue-200 rounded text-[10px] font-bold flex items-center justify-center gap-1"
                                >
                                  📞 Llamar
                                </button>
                                <button
                                  onClick={() => setWhatsAppModalLead(item)}
                                  className="py-1 px-2 bg-emerald-950 hover:bg-emerald-900 border border-emerald-800 text-emerald-200 rounded text-[10px] font-bold flex items-center justify-center gap-1"
                                >
                                  💬 WhatsApp
                                </button>
                              </div>

                              {/* CONTROLES DE ETAPA */}
                              <div className="flex justify-between gap-1 pt-1 border-t border-slate-800 text-[10px]">
                                {stage.key !== 'PROSPECCION' && (
                                  <button onClick={() => moveStage(item.id, 'PROSPECCION')} className="p-1 bg-slate-800 rounded text-slate-400 hover:text-white">◀ Prosp.</button>
                                )}
                                {stage.key !== 'COTIZADO' && (
                                  <button onClick={() => moveStage(item.id, 'COTIZADO')} className="px-2 py-0.5 bg-purple-950 border border-purple-800 rounded text-purple-300">Cotizar</button>
                                )}
                                {stage.key !== 'GANADO' && (
                                  <button onClick={() => moveStage(item.id, 'GANADO')} className="px-2 py-0.5 bg-emerald-950 border border-emerald-800 rounded text-emerald-300">Ganado ✔</button>
                                )}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* VISTA 2: TABLA */}
              {viewMode === 'table' && (
                <div className="bg-slate-950 rounded-xl border border-slate-800 overflow-hidden">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-900 text-slate-400 uppercase text-[10px] font-bold border-b border-slate-800">
                      <tr>
                        <th className="p-3">ID / Fecha</th>
                        <th className="p-3">Cliente / RUC</th>
                        <th className="p-3">Unidad</th>
                        <th className="p-3">Servicio / Maquinaria</th>
                        <th className="p-3">Ruta</th>
                        <th className="p-3 text-right">Venta (USD)</th>
                        <th className="p-3 text-right">Profit (USD)</th>
                        <th className="p-3 text-center">Acciones Rápidas</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800 text-slate-300">
                      {filteredLeads.map(item => (
                        <tr key={item.id} className="hover:bg-slate-900/60">
                          <td className="p-3 font-mono font-bold text-slate-200">{item.id}</td>
                          <td className="p-3">
                            <p className="font-bold text-white">{item.cliente}</p>
                            <p className="text-[10px] text-slate-400 font-mono">RUC: {item.ruc}</p>
                          </td>
                          <td className="p-3">
                            <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-900 border border-slate-800 text-slate-300">{item.empresaGrupo}</span>
                          </td>
                          <td className="p-3">
                            {item.sourcing ? (
                              <span className="text-amber-300 font-bold">🚜 {item.sourcing.maquinariaMarca} {item.sourcing.maquinariaModelo}</span>
                            ) : (
                              <span>{item.servicio} - {item.incoterm}</span>
                            )}
                          </td>
                          <td className="p-3 font-mono text-[11px]">{item.pol.split('-')[0]} ➔ {item.pod.split('-')[0]}</td>
                          <td className="p-3 text-right font-mono font-bold text-white">${Number(item.precioVenta).toLocaleString()}</td>
                          <td className="p-3 text-right font-mono font-bold text-emerald-400">+${Number(item.profit).toLocaleString()}</td>
                          <td className="p-3 text-center space-x-1">
                            <button onClick={() => setVoipModalLead(item)} className="px-2 py-1 bg-blue-950 border border-blue-800 text-blue-200 rounded text-[10px] font-bold">📞 Llamar</button>
                            <button onClick={() => setWhatsAppModalLead(item)} className="px-2 py-1 bg-emerald-950 border border-emerald-800 text-emerald-200 rounded text-[10px] font-bold">💬 WhatsApp</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {/* VISTA 3: COTIZADOR SOURCING */}
              {viewMode === 'quoter' && (
                <div className="max-w-4xl mx-auto bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-6">
                  <h3 className="text-base font-bold text-amber-300 flex items-center gap-2">
                    <span>🚜 Calculadora de Sourcing en China & Maquinaria Pesada</span>
                  </h3>
                  <p className="text-xs text-slate-400">
                    Fórmula consolidada: Costo Maquinaria (FOB) + Flete (Branko) + Gastos Aduana (Hogels) + Comisión Sourcing (%) = Precio Total Venta y Profit Consolidado.
                  </p>

                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-xs">
                    <div className="bg-amber-950/30 p-3 rounded-xl border border-amber-900/60">
                      <label className="text-amber-300 block mb-1 font-bold">1. Costo Maquinaria FOB ($):</label>
                      <input type="number" value={sourcingFob} onChange={e => setSourcingFob(Number(e.target.value))} className="w-full bg-slate-950 border border-amber-800 rounded p-2 text-white font-mono font-bold text-sm" />
                    </div>

                    <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                      <label className="text-red-300 block mb-1 font-bold">2. Flete (Branko) ($):</label>
                      <input type="number" value={brankoFreight} onChange={e => setBrankoFreight(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white font-mono text-sm" />
                    </div>

                    <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                      <label className="text-indigo-300 block mb-1 font-bold">3. Aduanas (Hogels) ($):</label>
                      <input type="number" value={hogelsCustoms} onChange={e => setHogelsCustoms(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white font-mono text-sm" />
                    </div>

                    <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                      <label className="text-emerald-300 block mb-1 font-bold">4. Comisión Sourcing (%):</label>
                      <input type="number" value={sourcingCommPct} onChange={e => setSourcingCommPct(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white font-mono text-sm font-bold" />
                      <span className="text-[10px] text-emerald-400 mt-1 block">+${sourcingCommUsd.toLocaleString()} USD</span>
                    </div>
                  </div>

                  <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 space-y-3 text-xs">
                    <div className="flex justify-between items-center text-slate-300">
                      <span>Costo Total Operativo de Compra:</span>
                      <span className="font-mono font-bold text-base text-white">${totalSourcingCost.toLocaleString()} USD</span>
                    </div>
                    <div className="flex justify-between items-center text-amber-300 pt-2 border-t border-slate-800">
                      <span className="font-bold text-sm">PRECIO TOTAL VENTA AL CLIENTE:</span>
                      <span className="font-mono font-black text-2xl text-white">${totalSourcingVenta.toLocaleString()} USD</span>
                    </div>
                    <div className="flex justify-between items-center text-emerald-400">
                      <span className="font-semibold">PROFIT CONSOLIDADO BROGELS:</span>
                      <span className="font-mono font-bold text-lg">+${totalSourcingProfit.toLocaleString()} USD</span>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>

          {/* MODAL NUEVO LEAD / SOURCING */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto">
              <div className="bg-slate-950 border border-slate-800 w-full max-w-2xl rounded-2xl p-6 shadow-2xl space-y-4 text-xs">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-white">Nuevo Registro: Logística & Sourcing China</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleCreateLead} className="space-y-4">
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="text-slate-400 block mb-1">Unidad Operativa:</label>
                      <select 
                        value={newLead.empresaGrupo} 
                        onChange={e => setNewLead({...newLead, empresaGrupo: e.target.value})}
                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-white font-bold"
                      >
                        <option value="Compras Internacionales">Compras Internacionales (Sourcing China)</option>
                        <option value="Branko">Branko (Agencia de Carga)</option>
                        <option value="Hogels">Hogels (Agencia de Aduana)</option>
                      </select>
                    </div>

                    <div>
                      <label className="text-slate-400 block mb-1">Servicio Solicitado:</label>
                      <select 
                        value={newLead.servicio} 
                        onChange={e => setNewLead({...newLead, servicio: e.target.value})}
                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-white"
                      >
                        <option value="Sourcing China">Sourcing China (Maquinaria Pesada)</option>
                        <option value="SLI">SLI (Carga + Aduana Integral)</option>
                        <option value="Carga">Solo Flete Internacional</option>
                        <option value="Aduana">Solo Aduana</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="text-slate-400 block mb-1">Razón Social / Cliente:</label>
                      <input required type="text" placeholder="Ej. Minera del Centro S.A.C." value={newLead.cliente} onChange={e => setNewLead({...newLead, cliente: e.target.value})} className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-white" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">RUC (11 dígitos):</label>
                      <input required type="text" maxLength="11" placeholder="20551122334" value={newLead.ruc} onChange={e => setNewLead({...newLead, ruc: e.target.value})} className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-white font-mono" />
                    </div>
                  </div>

                  {/* SOURCING CHINA ESPECÍFICO */}
                  <div className="bg-amber-950/30 p-3.5 rounded-xl border border-amber-900/60 space-y-3">
                    <p className="font-bold text-amber-300">Gestión de Compra en Origen (China/Otros)</p>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-slate-400 block mb-1 text-[11px]">Proveedor / Fábrica en China:</label>
                        <input type="text" placeholder="Ej. SANY Heavy Industry" value={newLead.sourcing.proveedorChina} onChange={e => setNewLead({...newLead, sourcing: {...newLead.sourcing, proveedorChina: e.target.value}})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white" />
                      </div>
                      <div>
                        <label className="text-slate-400 block mb-1 text-[11px]">Ciudad / Inspección:</label>
                        <input type="text" placeholder="Ej. Shanghai / Changsha" value={newLead.sourcing.ciudadInspeccion} onChange={e => setNewLead({...newLead, sourcing: {...newLead.sourcing, ciudadInspeccion: e.target.value}})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white" />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-slate-400 block mb-1 text-[11px]">Estado de Sourcing:</label>
                        <select value={newLead.sourcing.estadoSourcing} onChange={e => setNewLead({...newLead, sourcing: {...newLead.sourcing, estadoSourcing: e.target.value}})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-amber-300 font-bold">
                          <option value="Búsqueda Proveedor">Búsqueda Proveedor</option>
                          <option value="Cotización Maquinaria">Cotización Maquinaria</option>
                          <option value="Inspección en China">Inspección en China</option>
                          <option value="Proforma Aprobada">Proforma Aprobada</option>
                          <option value="Pago Realizado">Pago Realizado</option>
                          <option value="En Tránsito">En Tránsito</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-slate-400 block mb-1 text-[11px]">Maquinaria (Marca/Modelo):</label>
                        <input type="text" placeholder="Ej. SANY SY215C" value={newLead.sourcing.maquinariaMarca} onChange={e => setNewLead({...newLead, sourcing: {...newLead.sourcing, maquinariaMarca: e.target.value}})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white" />
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="text-slate-400 block mb-1">Costo Compra Consolidado ($):</label>
                      <input type="number" value={newLead.costoCompra} onChange={e => setNewLead({...newLead, costoCompra: Number(e.target.value)})} className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-white font-mono" />
                    </div>
                    <div>
                      <label className="text-emerald-400 block mb-1 font-bold">Precio Venta Oferta ($):</label>
                      <input type="number" value={newLead.precioVenta} onChange={e => setNewLead({...newLead, precioVenta: Number(e.target.value)})} className="w-full bg-slate-900 border border-emerald-800 rounded-lg p-2.5 text-emerald-300 font-mono font-bold" />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-3">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 bg-slate-800 rounded-lg font-semibold">Cancelar</button>
                    <button type="submit" className="px-5 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg font-bold shadow-lg shadow-red-950">Guardar Lead</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL WEBRTC VOIP CLICK-TO-CALL */}
          {voipModalLead && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-slate-950 border border-slate-800 w-full max-w-sm rounded-2xl p-6 shadow-2xl text-center space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <span className="text-[10px] text-emerald-400 font-bold uppercase">Brogels WebRTC VoIP</span>
                  <button onClick={() => setVoipModalLead(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div>
                  <h4 className="font-bold text-white text-base">{voipModalLead.cliente}</h4>
                  <p className="text-xs text-slate-400">{voipModalLead.contacto || 'Contacto'}</p>
                  <p className="text-sm font-mono font-bold text-blue-400 mt-1">{voipModalLead.telefono || '+51 984512369'}</p>
                </div>
                <div className="py-4 space-y-2">
                  <div className="inline-block p-4 rounded-full bg-blue-600/20 text-blue-400 border border-blue-500/40 animate-pulse text-2xl">
                    📞
                  </div>
                  <p className="text-xs text-emerald-400 font-mono">Conectado (00:48)</p>
                </div>
                <div className="text-left space-y-2 text-xs">
                  <label className="text-slate-400 block text-[11px]">Resultado de la Llamada:</label>
                  <select className="w-full bg-slate-900 border border-slate-800 rounded p-2 text-white font-semibold">
                    <option>Contestó - Interesado</option>
                    <option>Contestó - Enviar Cotización</option>
                    <option>Venta Realizada / Aprobó Booking</option>
                    <option>Ocupado / Buzón de Voz</option>
                  </select>
                </div>
                <button
                  onClick={() => {
                    alert('Llamada registrada con éxito en el historial del lead');
                    setVoipModalLead(null);
                  }}
                  className="w-full py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-bold"
                >
                  Colgar y Guardar en Bitácora
                </button>
              </div>
            </div>
          )}

          {/* MODAL WHATSAPP BUSINESS API */}
          {whatsAppModalLead && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-slate-950 border border-slate-800 w-full max-w-lg rounded-2xl p-6 shadow-2xl space-y-4 text-xs">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <span className="text-[10px] text-emerald-400 font-bold uppercase">WhatsApp Business API · Brogels</span>
                  <button onClick={() => setWhatsAppModalLead(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div>
                  <h4 className="font-bold text-white text-sm">{whatsAppModalLead.cliente}</h4>
                  <p className="text-slate-400 text-[11px] font-mono">{whatsAppModalLead.telefono} · {whatsAppModalLead.contacto}</p>
                </div>
                <div className="space-y-2">
                  <label className="text-slate-300 block font-semibold">Plantilla Automática:</label>
                  <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 text-[11px] text-slate-300 leading-relaxed">
                    Hola {whatsAppModalLead.contacto || whatsAppModalLead.cliente}, te saluda Yuri Vega de Brogels Compras Internacionales. Te confirmamos el avance en la inspección de tu maquinaria {whatsAppModalLead.sourcing?.maquinariaMarca || ''} en China. Tenemos la proforma lista. ¿Cuándo podemos coordinar?
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setWhatsAppModalLead(null)} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-lg">Cerrar</button>
                  <button onClick={() => {
                    window.open(`https://wa.me/${(whatsAppModalLead.telefono||'').replace(/\D/g,'')}`, '_blank');
                    setWhatsAppModalLead(null);
                  }} className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold">Enviar por WhatsApp</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BrogelsCRMApp />);
  </script>
</body>
</html>
